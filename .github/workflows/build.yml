# Tests the client, and builds voice-client.exe for the Windows PC.
#
# - Every push to main and every pull request: lint, unit tests, and the .exe
#   as a workflow artifact (download it from the run page, logged in).
# - A tag v*: the same, and a GitHub release with voice-client.exe and its
#   SHA-256. The repository is public, so the Windows PC downloads it without
#   a login: .\scripts\run.ps1 -Update.
#
# Actions are pinned by commit, like the Docker images by digest.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: client/go.mod
          cache-dependency-path: client/go.sum
      - run: make lint
      - run: make test

  windows:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write # only used by the release step, on a tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: client/go.mod
          cache-dependency-path: client/go.sum
      # Cross-build with MinGW (cgo for the audio library), as "make windows".
      - name: Install MinGW-w64
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64
      - name: Build voice-client.exe
        working-directory: client
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('main-{0}', github.sha) }}
        run: |
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 CC=x86_64-w64-mingw32-gcc \
            go build -trimpath -ldflags "-X main.version=${VERSION:0:12} -extldflags=-static" \
            -o bin/voice-client.exe ./cmd/voice-client
          cd bin && sha256sum voice-client.exe > voice-client.exe.sha256 && cat voice-client.exe.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: voice-client-windows
          path: |
            client/bin/voice-client.exe
            client/bin/voice-client.exe.sha256
          retention-days: 30
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          client/bin/voice-client.exe client/bin/voice-client.exe.sha256
          --title "$GITHUB_REF_NAME" --generate-notes
