# Bounded container logs, same policy as server/compose.yaml.
x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  dashboard:
    build:
      context: .
    ports:
      - "${DASHBOARD_PORT:-3005}:3000"
    volumes:
      - dashboard-data:/data
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  dashboard-data:
